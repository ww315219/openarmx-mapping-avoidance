/**:
  ros__parameters:
    global_frame: "world"
    pose_frame: "camera_infra1_optical_frame"
    map_clearing_frame_id: "camera_infra1_optical_frame"
    esdf_slice_bounds_visualization_attachment_frame_id: "world"
    workspace_height_bounds_visualization_attachment_frame_id: "world"

    voxel_size: 0.015
    num_cameras: 1
    use_tf_transforms: true
    mapping_type: "static_tsdf"
    esdf_mode: "3d"
    publish_esdf_distance_slice: true

    use_depth: true
    use_color: false
    use_lidar: false
    input_qos: "SENSOR_DATA"
    maximum_input_queue_length: 10

    tick_period_ms: 10
    integrate_depth_rate_hz: 20.0
    integrate_color_rate_hz: 0.0
    update_mesh_rate_hz: 5.0
    update_esdf_rate_hz: 10.0
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 2.0
    decay_tsdf_rate_hz: 1.0
    clear_map_outside_radius_rate_hz: 1.0

    print_rates_to_console: true
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: true
    print_statistics_on_console_period_ms: 5000

    map_clearing_radius_m: 2.5
    layer_visualization_min_tsdf_weight: 0.02
    layer_visualization_exclusion_height_m: 3.0
    layer_visualization_exclusion_radius_m: 5.0
    max_back_projection_distance: 1.8
    back_projection_subsampling: 1

    static_mapper:
      # Keep nvblox-side preprocessing disabled for FFS depth. In the Jazzy
      # binary this can crash with a mask/image size mismatch on this stream.
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 0
      projective_integrator_max_integration_distance_m: 1.8
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 6.0
      raycast_subsampling_factor: 4
      workspace_bounds_type: "unbounded"
      esdf_integrator_min_weight: 0.12
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      mesh_integrator_min_weight: 0.02
      mesh_integrator_weld_vertices: true
      esdf_slice_height: 0.0
      esdf_slice_min_height: -1.5
      esdf_slice_max_height: 1.5
